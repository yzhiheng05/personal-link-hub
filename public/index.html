<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Hub</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="index">
    <div class="shell">
      <aside class="rail">
        <div>
          <p class="eyebrow">Personal Link Hub</p>
          <h1>个人链接中转站</h1>
          <p class="rail-copy">把网页收进来，留下摘要、标签和可分享的短链。</p>
        </div>
        <nav class="nav">
          <a class="nav-link active" href="/">卡片流</a>
          <a class="nav-link" href="/new">新增链接</a>
          <a class="nav-link" href="/taxonomy">标签管理</a>
        </nav>
        <button id="logout-button" class="ghost-button" type="button">退出登录</button>
      </aside>
      <main class="panel">
        <section class="collection-toolbar">
          <div class="collection-heading">
            <p class="eyebrow">Library Wall</p>
            <h2>收藏墙</h2>
          </div>
          <div class="collection-actions">
            <input id="search-input" class="field search-field" type="search" placeholder="搜索标题、URL、备注" />
            <div id="status-filter" class="status-segmented" role="group" aria-label="收藏状态筛选" data-status-value="active">
              <button class="status-segment active" type="button" data-status-filter-value="active" aria-pressed="true">活跃</button>
              <button class="status-segment" type="button" data-status-filter-value="archived" aria-pressed="false">归档</button>
              <button class="status-segment" type="button" data-status-filter-value="" aria-pressed="false">全部</button>
            </div>
            <a class="primary-button compact-button" href="/new">新增</a>
          </div>
          <div id="tag-filter" class="tag-cluster tag-filter-strip"></div>
        </section>
        <section class="collection-section">
          <div class="section-heading collection-count-row">
            <h3>全部收藏</h3>
            <p id="list-hint" class="muted">加载中...</p>
          </div>
          <p id="list-message" class="muted message-slot message-pill" aria-live="polite"></p>
          <div id="link-grid" class="link-grid collection-grid"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
