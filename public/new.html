<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新增链接</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="new">
    <div class="shell">
      <aside class="rail">
        <div>
          <p class="eyebrow">Capture</p>
          <h1>创建收藏卡片</h1>
          <p class="rail-copy">边写边预览，把链接整理成可以长期使用的资料卡。</p>
        </div>
        <nav class="nav">
          <a class="nav-link" href="/">卡片流</a>
          <a class="nav-link active" href="/new">新增链接</a>
          <a class="nav-link" href="/taxonomy">标签管理</a>
        </nav>
        <button id="logout-button" class="ghost-button" type="button">退出登录</button>
      </aside>
      <main class="panel panel-wide new-workbench">
        <section class="new-workbench-layout">
          <form id="link-form" class="surface-card content-form new-card-form">
            <div class="form-section">
              <div class="form-section-heading">
                <p class="eyebrow">Core</p>
                <h2>核心信息</h2>
              </div>
              <label class="form-field"><span class="field-label-pill">URL</span><input id="url" name="url" class="field" type="url" placeholder="https://example.com" required /></label>
              <label class="form-field"><span class="field-label-pill">标题</span><input id="title" name="title" class="field" type="text" placeholder="给这张收藏卡起个名字" /></label>
              <label class="form-field"><span class="field-label-pill">摘要</span><textarea id="summary" name="summary" class="field textarea compact-textarea" placeholder="一句话说明它为什么值得收藏"></textarea></label>
            </div>

            <div class="form-section">
              <div class="form-section-heading">
                <p class="eyebrow">Visual</p>
                <h2>视觉信息</h2>
              </div>
              <label class="form-field"><span class="field-label-pill">封面图 URL</span><input id="cover" name="coverImageUrl" class="field" type="url" placeholder="可选，留空会生成站点牌" /></label>
            </div>

            <div class="form-section">
              <div class="form-section-heading">
                <p class="eyebrow">Organize</p>
                <h2>整理信息</h2>
              </div>
              <label class="form-field"><span class="field-label-pill">备注</span><textarea id="note" name="note" class="field textarea compact-textarea" placeholder="只给自己看的补充说明"></textarea></label>
              <div class="form-field">
                <span class="field-label-pill">标签</span>
                <div id="tag-editor" class="tag-editor"></div>
              </div>
            </div>

            <div class="new-form-actions">
              <button class="primary-button" type="submit">保存链接</button>
              <p id="save-message" class="muted message-slot message-pill"></p>
            </div>
          </form>

          <aside class="preview-panel">
            <div class="preview-panel-head">
              <p class="eyebrow">Live Preview</p>
              <h2>收藏墙预览</h2>
              <p class="muted">这里显示保存后大概会出现在首页的样子，不会提前写入数据库。</p>
            </div>
            <div id="new-preview-card" class="preview-card-shell collection-grid"></div>
          </aside>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
